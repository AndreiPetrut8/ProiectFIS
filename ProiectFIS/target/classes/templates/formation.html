<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/3.5.0/remixicon.css" />
    <link th:href="@{/style.css}" rel="stylesheet" />
    <title>Select Formation</title>
</head>
<body style="background-color: #4b0082;">
    <div class="login">
        <div class="login__form">
            <h1 class="login__title">Select Formation</h1>

           <form th:action="@{/formation}" method="post" class="login__inputs">

    <div class="formations">

        <label>
            <input type="radio" name="formation" value="2-2-1" required>
            <img src="/images/2-2-1.jpeg" class="formation-img">
        </label>

        <label>
            <input type="radio" name="formation" value="1-3-1">
            <img src="/images/1-3-1.jpeg" class="formation-img">
        </label>

        <label>
            <input type="radio" name="formation" value="2-1-2">
            <img src="/images/2-1-2.jpeg" class="formation-img">
        </label>


        <label>
            <input type="radio" name="formation" value="3-1-1">
            <img src="/images/3-1-1.jpeg" class="formation-img">
        </label>

    </div>

    <div class="login__box">
        <input class="login__input" type="text" name="description" placeholder="Descriere tactică" required />
        <i class="ri-chat-1-line"></i>
    </div>

    <button type="submit" class="login__button">Confirm</button>

</form>


            <div class="login__register">
                <a th:href="@{/antrenor}">Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
